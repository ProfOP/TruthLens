server.port=${PORT:8080}
spring.application.name=truthlens-backend
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/truthlens}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:truthlens}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:change-me-local}
spring.jpa.hibernate.ddl-auto=none
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=12MB
ai.service.url=${AI_SERVICE_URL:http://localhost:8001}
truthlens.storage.dir=${TRUTHLENS_STORAGE_DIR:../storage}
truthlens.jobs.sync=${TRUTHLENS_JOBS_SYNC:false}
truthlens.jobs.workers=${TRUTHLENS_JOBS_WORKERS:2}
truthlens.jobs.lease-seconds=${TRUTHLENS_JOBS_LEASE_SECONDS:60}
truthlens.jobs.heartbeat-ms=${TRUTHLENS_JOBS_HEARTBEAT_MS:10000}
truthlens.jobs.sweep-ms=${TRUTHLENS_JOBS_SWEEP_MS:30000}

